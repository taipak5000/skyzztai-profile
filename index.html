<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0B1220" id="themeColorMeta" />
<script>
  // 🌓 描画前にテーマを確定させ、ダークモード時に一瞬でも違うテーマの背景が
  // 表示されてしまう「ちらつき」を防止する（CSSが解釈される前に同期実行）
  (function () {
    try {
      var saved = localStorage.getItem('sky_app_theme');
      var isDark = saved ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      var meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', isDark ? '#0B1220' : '#EEF5FC');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<title>Profile</title>
<meta name="description" content="自己紹介ページ" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%2338BDF8'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/app-icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="プロフィール" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* ☀️ ライトモード（既定値）。もともとこのサイトは紺色の固定配色だったため、
       この:rootを新しく明るい配色として設計し、従来の紺色配色は
       そのまま下の[data-theme="dark"]側（ダークモード）に移設した。
       アクセント色（--sky/--sky-bright/--teal/--indigo）は色相はそのまま、
       白背景でのAAコントラスト確保のため明るさだけ落としている。 */
    --bg: #EEF5FC;           /* 背景の淡い水色 */
    --bg-glow: rgba(56, 189, 248, 0.12);
    --grid-line: rgba(2, 132, 199, 0.06);
    --panel: #FFFFFF;        /* カード本体 */
    --panel-alt: #E4EFFA;    /* タブバー・ホバー面 */
    --row: #F1F7FD;          /* リンク行の面 */
    --border: rgba(15, 23, 42, 0.12);
    --border-strong: rgba(2, 132, 199, 0.45);
    --text: #0F172A;         /* 本文の文字色 */
    --text-muted: #51607A;   /* 補足・コメント色 */
    --sky: #0284C7;          /* メインの水色（テキストでも読めるよう暗め） */
    --sky-bright: #0369A1;   /* 強調用の水色（ホバー用） */
    --sky-deep: #0EA5E9;     /* 濃い水色（バッジ等の塗り。両テーマ共通） */
    --teal: #0F766E;         /* 差し色(青緑。テキストでも読めるよう暗め) */
    --indigo: #818CF8;       /* 差し色（青紫） */
    --radius: 16px;

    /* 画面サイズに応じて広がる余白 */
    --page-pad-y: clamp(40px, 8vw, 96px);
    --page-pad-x: clamp(12px, 3vw, 56px);
    --page-pad-b: clamp(32px, 6vw, 72px);
    --card-pad-y: clamp(30px, 5vw, 56px);
    --card-pad-x: clamp(20px, 5vw, 48px);
    --card-pad-b: clamp(26px, 4.5vw, 48px);
  }

  /* 🌙 ダークモード用のカラー上書き。以前このサイトが常時使っていた紺色配色を
     そのままダークモードの値として保持している（見た目は変更前と同一）。 */
  [data-theme="dark"] {
    --bg: #0B1220;
    --bg-glow: rgba(56, 189, 248, 0.16);
    --grid-line: rgba(56, 189, 248, 0.07);
    --panel: #131E30;
    --panel-alt: #0C1729;
    --row: #101D32;
    --border: rgba(148, 163, 184, 0.22);
    --border-strong: rgba(56, 189, 248, 0.5);
    --text: #EDF2F9;
    --text-muted: #A9B8CC;
    --sky: #38BDF8;
    --sky-bright: #7DD3FC;
    --teal: #2DD4BF;
  }

  /* 🌙 ダークモード用：CSS変数化されていない直書きの色（背景の縦グラデ・カードの影・
     Sky Statusパネルの背景・警告色・フッター文字色）も、以前の見た目のまま保持する。
     ライトモード側の値は各セレクタの元の宣言（下）で新規に定義している。 */
  [data-theme="dark"] body {
    background-image:
      radial-gradient(ellipse 60% 40% at 18% 10%, rgba(56,189,248,0.16), transparent 60%),
      radial-gradient(ellipse 55% 35% at 85% 8%, rgba(125,211,252,0.13), transparent 60%),
      radial-gradient(ellipse 60% 45% at 78% 92%, rgba(45,212,191,0.12), transparent 60%),
      radial-gradient(ellipse 55% 40% at 12% 88%, rgba(56,189,248,0.1), transparent 60%),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(180deg, #0B1220 0%, #0E1B30 50%, #0B1220 100%);
  }
  [data-theme="dark"] .card {
    box-shadow:
      0 1px 2px rgba(0,0,0,0.4),
      0 20px 40px -18px rgba(56,189,248,0.28),
      0 40px 80px -32px rgba(0,0,0,0.6);
  }
  [data-theme="dark"] .sky-panel {
    background: linear-gradient(160deg, rgba(56,189,248,0.12), rgba(19,30,48,0.92));
  }
  [data-theme="dark"] .sky-reset-val.soon { color: #FBBF24; }
  [data-theme="dark"] .footnote { color: rgba(148, 163, 184, 0.55); }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'M PLUS 1 Code', 'Consolas', 'Hiragino Sans', monospace;
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 60% 40% at 18% 10%, rgba(56,189,248,0.16), transparent 60%),
      radial-gradient(ellipse 55% 35% at 85% 8%, rgba(125,211,252,0.13), transparent 60%),
      radial-gradient(ellipse 60% 45% at 78% 92%, rgba(45,212,191,0.12), transparent 60%),
      radial-gradient(ellipse 55% 40% at 12% 88%, rgba(56,189,248,0.1), transparent 60%),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(180deg, #EEF5FC 0%, #F7FBFF 50%, #EEF5FC 100%);
    background-size: auto, auto, auto, auto, 34px 34px, 34px 34px, 100% 100%;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: var(--page-pad-y) var(--page-pad-x) var(--page-pad-b);
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- 飛び散るシャボン玉パーティクル ---------- */
  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(125,211,252,0.4) 45%, rgba(56,189,248,0.15) 75%, transparent 100%);
    border: 1px solid rgba(186,230,253,0.45);
    box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
    animation: particle-float 0.9s ease-out forwards;
    will-change: transform, opacity;
  }

  @keyframes particle-float {
    0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% - 70px)) scale(1.2); opacity: 0; }
  }

  /* ---------- カード本体 ---------- */
  .card {
    position: relative;
    width: 100%;
    background: var(--panel);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: var(--card-pad-y) var(--card-pad-x) var(--card-pad-b);
    box-shadow:
      0 1px 2px rgba(15,23,42,0.08),
      0 20px 40px -18px rgba(2,132,199,0.18),
      0 40px 80px -32px rgba(15,23,42,0.12);
    animation: card-settle 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* ---------- ターミナル風タブバー ---------- */
  .term-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: calc(var(--card-pad-y) * -1) calc(var(--card-pad-x) * -1) 24px;
    padding: clamp(11px, 2.2vw, 16px) clamp(14px, 3vw, 20px);
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .term-dots {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .term-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .term-dot:nth-child(1) { background: #FF5F56; }
  .term-dot:nth-child(2) { background: #FFBD2E; }
  .term-dot:nth-child(3) { background: #27C93F; }

  .card-label {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- 言語切り替えボタン ---------- */
  .lang-toggle {
    flex-shrink: 0;
    margin-left: auto;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--sky-bright);
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 4px 11px;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  }

  .lang-toggle:hover,
  .lang-toggle:focus-visible {
    border-color: var(--sky);
    background: var(--row);
    color: var(--text);
  }

  .lang-toggle:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 2px;
  }

  /* ---------- プロフィール ---------- */
  .profile { text-align: center; }

  .avatar-wrap {
    position: relative;
    width: 112px;
    height: 112px;
    margin: 0 auto 18px;
    cursor: pointer;
  }

  .avatar.boing { animation: avatar-boing 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  @keyframes avatar-boing {
    0%   { transform: scale(1, 1); }
    30%  { transform: scale(0.88, 1.12); }
    55%  { transform: scale(1.12, 0.9); }
    75%  { transform: scale(0.96, 1.04); }
    100% { transform: scale(1, 1); }
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--sky-deep), var(--indigo));
    color: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 700;
    overflow: hidden;
    border: 4px solid var(--panel);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.4), 0 10px 24px -8px rgba(56,189,248,0.4);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text);
    margin: 0 0 8px;
  }

  .name::before {
    content: "> ";
    color: var(--sky);
    font-weight: 700;
  }

  .name::after {
    content: "_";
    color: var(--sky);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .tagline {
    display: block;
    font-size: 15px;
    font-weight: 500;
    font-style: italic;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    margin: 0 0 14px;
  }

  .tagline::before {
    content: "// ";
    opacity: 0.7;
  }

  .badges-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 0 0 18px;
  }

  .info-badge {
    display: inline-flex;
    align-items: stretch;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    overflow: hidden;
  }

  .info-badge-label {
    background: var(--panel-alt);
    color: var(--text-muted);
    padding: 5px 11px;
  }

  .info-badge-value {
    background: var(--sky-deep);
    color: #04202E;
    padding: 5px 11px;
  }

  .bio {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.75;
    color: var(--text-muted);
    margin: 0 auto;
    text-align: left;
    white-space: pre-line;
  }

  /* ---------- もっと知りたい人向け ---------- */
  .more-info {
    margin: 18px auto 0;
    text-align: center;
  }

  .more-info-summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    list-style: none;
    font-size: 13px;
    font-weight: 700;
    color: var(--sky-bright);
    padding: 6px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--panel-alt);
    user-select: none;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }

  .more-info-summary::-webkit-details-marker { display: none; }

  .more-info-summary::before {
    content: "▸";
    font-size: 10px;
    color: var(--sky);
    transition: transform 0.2s ease;
  }

  .more-info[open] .more-info-summary::before { transform: rotate(90deg); }

  .more-info-summary:hover,
  .more-info-summary:focus-visible {
    border-color: var(--sky);
    background: var(--row);
  }

  .more-info-summary:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 2px;
  }

  .more-info-content {
    margin: 12px 0 0;
    padding: 12px 14px;
    border-left: 2px solid var(--border-strong);
    background: var(--panel-alt);
    border-radius: 0 8px 8px 0;
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.7;
    color: var(--text-muted);
    text-align: left;
    white-space: pre-line;
  }

  /* ---------- 区切り線 ---------- */
  .divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 26px 0 22px;
  }

  /* ---------- リンク一覧 ---------- */
  .section-label {
    display: block;
    font-size: 13px;
    font-style: italic;
    color: var(--text-muted);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }

  .section-label::before {
    content: "// ";
    opacity: 0.7;
  }

  .links { display: flex; flex-direction: column; gap: 10px; }

  .link-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    text-decoration: none;
    color: inherit;
    background: var(--row);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .link-row:hover,
  .link-row:focus-visible {
    background: var(--panel-alt);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -14px rgba(56,189,248,0.55);
  }

  .link-row:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 1px;
  }

  .link-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(145deg, var(--sky), var(--sky-deep));
    color: #04202E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -3px rgba(56,189,248,0.45);
  }

  .link-row:nth-of-type(4n+2) .link-icon { background: linear-gradient(145deg, var(--teal), #0D9488); }
  .link-row:nth-of-type(4n+3) .link-icon { background: linear-gradient(145deg, var(--indigo), #4F46E5); }
  .link-row:nth-of-type(4n+4) .link-icon { background: linear-gradient(145deg, var(--sky-bright), #0369A1); }

  .link-row:hover .link-icon,
  .link-row:focus-visible .link-icon { animation: icon-wiggle 0.5s ease; }

  @keyframes icon-wiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-12deg) scale(1.1); }
    75% { transform: rotate(12deg) scale(1.1); }
  }

  .link-text { flex: 1; min-width: 0; }

  .link-title {
    display: block;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
  }

  .link-desc {
    display: block;
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.55;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: pre-line;
  }

  .link-row:hover .link-title,
  .link-row:focus-visible .link-title { color: var(--sky-bright); }

  .link-arrow {
    color: var(--sky);
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .link-row:hover .link-arrow,
  .link-row:focus-visible .link-arrow {
    transform: translateX(3px);
    color: var(--sky-bright);
  }

  /* ---------- Sky Status（アバター下のコンパクトパネル。PC/モバイル共通） ---------- */
  .avatar-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 320px;
    margin: 0 auto 18px;
  }
  .avatar-row .avatar-wrap { grid-column: 1 / 3; grid-row: 1; margin: 0 auto; justify-self: center; }
  .sky-panel-left { grid-column: 1; grid-row: 2; }
  .sky-panel-right { grid-column: 2; grid-row: 2; }

  /* ---------- 闇の破片バッジ（アバターの右下に付く小さなピル） ---------- */
  .shard-badge {
    position: absolute;
    right: -8px;
    bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel);
    border: 1.5px solid var(--border-strong);
    border-radius: 999px;
    padding: 3px 9px 3px 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text);
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.6);
    cursor: help;
    white-space: nowrap;
  }
  .shard-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: #3A4356;
    box-shadow: 0 0 0 2px var(--panel);
  }
  .shard-dot.red { background: #F87171; }
  .shard-dot.active { animation: sky-pulse 1.6s ease-in-out infinite; }
  .shard-dot.red.active { box-shadow: 0 0 6px 1px rgba(248,113,113,0.85), 0 0 0 2px var(--panel); }
  .shard-dot.black.active { box-shadow: 0 0 6px 1px rgba(148,163,184,0.6), 0 0 0 2px var(--panel); }
  .shard-badge.upcoming { opacity: 0.6; }

  /* ---------- タップで開く簡易ツールチップ（title属性の内容をそのまま表示） ---------- */
  /* PCはtitle属性のホバーで、スマホ等タップ操作の環境はこのクラスをタップで
     付け外しすることで、どちらでも同じ内容を確認できるようにする。 */
  .shard-badge.tap-open::after,
  .sky-reset-mini.tap-open::after {
    content: attr(title);
    position: absolute;
    top: 100%;
    margin-top: 6px;
    background: var(--panel);
    color: var(--text);
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.6;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    white-space: normal;
    width: max-content;
    max-width: 190px;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.6);
    z-index: 50;
    pointer-events: none;
  }
  .shard-badge.tap-open::after { right: 0; }
  .sky-reset-mini { position: relative; }
  .sky-reset-mini.tap-open::after { left: 0; }

  .sky-panel {
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    background: linear-gradient(160deg, rgba(2,132,199,0.10), rgba(255,255,255,0.92));
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 10px 22px -14px rgba(56,189,248,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .sky-panel-label {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sky-bright); margin-bottom: 6px;
  }
  .sky-live-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--teal); box-shadow: 0 0 6px 1px rgba(45,212,191,0.85);

  // key に対応する訳文を返す。{name} 形式のプレースホルダーは vars で置換する
  function t(key, vars) {
    const entry = TRANSLATIONS[key];
    let str = entry ? (entry[LANG] || entry.ja) : key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      });
    }
    return str;
  }

  // プロフィール／リンク／スケジュールなど「編集エリア」のオブジェクトから、
  // 現在の言語に対応するフィールドを取り出す（例: field='title' → LANGが'en'ならtitleEn、
  // 無ければtitleにフォールバック）
  function localizedField(obj, field) {
    if (!obj) return '';
    if (LANG === 'en') {
      const v = obj[field + 'En'];
      if (v) return v;
    }
    return obj[field] || '';
  }

  // data-i18n / data-i18n-title / data-i18n-placeholder が付いた要素に訳文を反映する
  function applyI18n() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) {

    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {

    if (toggleBtn) toggleBtn.textContent = LANG === 'ja' ? 'EN' : '日本語';

  /* ================================================================
     ⚙️ 表示設定（ダークモード・キーボードショートカット）
     taipak5000.github.io 配下の全ツール共通のキーで保存する
     （sky_app_theme・sky_shortcuts_enabled）。テーマの初期反映
     （読み込み時のちらつき防止）は<head>先頭の同期scriptで行うため、
     ここではトグル操作と設定モーダルの中身だけを扱う。
     ================================================================ */
  const SKY_THEME_KEY = 'sky_app_theme';
  const SKY_SHORTCUTS_KEY = 'sky_shortcuts_enabled';

  function isDarkModeOn() {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  }
  function applyThemeToDOM(isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    const meta = document.getElementById('themeColorMeta');
    if (meta) meta.setAttribute('content', isDark ? '#0B1220' : '#EEF5FC');
  }
  function toggleTheme() {
    const next = !isDarkModeOn();
    applyThemeToDOM(next);
    try { localStorage.setItem(SKY_THEME_KEY, next ? 'dark' : 'light'); } catch (e) { /* プライベートブラウジング等 */ }
    syncSettingsUI();
  }

  // 未設定（null）の場合は有効（true）扱い。他タブ/他サイトでの変更もすぐ反映されるよう、
  // キャッシュせずその都度localStorageから読み直す。
  function skyShortcutsEnabled() {
    try {
      const v = localStorage.getItem(SKY_SHORTCUTS_KEY);
      return v === null ? true : v === '1';
    } catch (e) { return true; }
  }
  function settingsSaveShortcutsPref(checked) {
    try { localStorage.setItem(SKY_SHORTCUTS_KEY, checked ? '1' : '0'); } catch (e) { /* プライベートブラウジング等 */ }
  }

  // 設定モーダル内のテーマ切替ボタン・ショートカットのチェックボックスの表示を、
  // 現在の状態（言語切替・他タブでの変更を含む）に同期させる。
  function syncSettingsUI() {
    const btn = document.getElementById('settingsThemeBtn');
    if (btn) btn.textContent = isDarkModeOn() ? t('darkModeOnLabel') : t('darkModeOffLabel');
    const cb = document.getElementById('settingsShortcutsCheckbox');
    if (cb) cb.checked = skyShortcutsEnabled();
  }
  function settingsOpen() {

  // ⌨️ Escキーで、開いていれば表示設定モーダルを閉じる（このリポジトリには
  // モーダルがこれ1つしかないため、単純にこのモーダルの開閉状態だけを見ればよい）。
  function closeTopmostOpenModal() {
    const overlay = document.getElementById('settingsModalOverlay');
    if (overlay && overlay.classList.contains('open')) settingsClose();
  }

  // ⌨️ 全ページ共通のキーボードショートカット（?＝表示設定を開く／d,D＝ダークモード切替／
  // Esc＝開いているモーダルを閉じる）。Escはテキスト入力中でも常に有効（ダイアログを閉じる
  // のはユーザーの期待に沿う、既存のクリックアウトサイドで閉じる挙動と同種の基本UXのため）
  // かつ sky_shortcuts_enabled の対象外。?とdは、テキスト入力中は通常の文字入力として使える
  // ようにガードする。
  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const targetEl = e.target;
    const isTyping = targetEl && (targetEl.tagName === 'INPUT' || targetEl.tagName === 'TEXTAREA' || targetEl.tagName === 'SELECT' || targetEl.isContentEditable);

    if (e.key === 'Escape') {
      closeTopmostOpenModal();
      return;
    }

    if (isTyping) return;
    if (!skyShortcutsEnabled()) return;

    if (e.key === '?') { e.preventDefault(); settingsOpen(); return; }
    if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleTheme(); return; }
  });

  /* ================================================================

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 指定した座標にシャボン玉を弾けさせる
  function burstParticles(x, y, count) {
    if (prefersReducedMotion) return;

    for (let i = 0; i < (count || 6); i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      const size = 8 + Math.random() * 10;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.setProperty('--dx', ((Math.random() - 0.5) * 90) + 'px');
      document.body.appendChild(p);
      p.addEventListener('animationend', function () { p.remove(); });
    }
  }

  // アバターをタップするとシャボン玉が弾ける
  function setupAvatarEasterEgg() {
    const avatarWrap = document.getElementById('avatar-wrap');
    const avatarEl = document.getElementById('avatar');

    avatarWrap.addEventListener('click', function () {
      const rect = avatarWrap.getBoundingClientRect();
      burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
      avatarEl.classList.remove('boing');
      void avatarEl.offsetWidth; // アニメーションを再生し直すためのリフロー
      avatarEl.classList.add('boing');
    });

    avatarEl.addEventListener('animationend', function () {
      avatarEl.classList.remove('boing');
    });
  }

  /* ================================================================
     ⏰ Sky Status：日本時間の時計・デイリー/エデンリセットカウントダウン
     Sky内部の時刻はアメリカ太平洋時間（PT）基準のため、
     リセット計算自体はPTで行い、表示はすべて日本時間に変換しています。
     ================================================================ */
  const PT_ZONE = 'America/Los_Angeles';
  const pad2 = n => String(n).padStart(2, '0');

  function getZoneParts(zone, baseDate) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: zone, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      weekday: 'short'
    }).formatToParts(baseDate || new Date());
    const get = t => (parts.find(p => p.type === t) || {}).value;
    return {
      y: get('year'), mo: get('month'), d: get('day'),
      h: Number(get('hour')) % 24, mi: Number(get('minute')), s: Number(get('second')),
      weekday: get('weekday')
    };
  }

  // PTの0:00は日本時間の16時（夏時間）/17時（冬時間）。現在のPT/JST時差から逆算する
  function jstResetHour() {
    const now = new Date();
    const pt = new Date(now.toLocaleString('en-US', { timeZone: PT_ZONE }));
    const jst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
    const diffH = Math.round((jst - pt) / 3600000);
    return diffH % 24;
  }

  function updateSkyClocks() {
    const pt = getZoneParts(PT_ZONE);
    const jst = getZoneParts('Asia/Tokyo');

    document.getElementById('skyJstClock').textContent = `${pad2(jst.h)}:${pad2(jst.mi)}:${pad2(jst.s)}`;
    document.getElementById('skyClockSub').textContent = t('gameTime', { time: `${pad2(pt.h)}:${pad2(pt.mi)}` });

    // デイリーリセット: 毎日 Sky時間0:00（＝PT 0:00）
    const secOfDay = pt.h * 3600 + pt.mi * 60 + pt.s;
    const secLeft = 86400 - secOfDay;
    const dh = Math.floor(secLeft / 3600), dm = Math.floor((secLeft % 3600) / 60), ds = secLeft % 60;
    const dailyEl = document.getElementById('skyDailyCountdown');
    dailyEl.textContent = `${pad2(dh)}:${pad2(dm)}:${pad2(ds)}`;
    dailyEl.classList.toggle('soon', secLeft <= 3600);
    const rh = jstResetHour();
    document.getElementById('skyDailyResetMini').title = t('dailyResetTooltip', { hour: rh });

    // エデンリセット: Sky時間の日曜0:00（＝PT 日曜0:00）
    const weekdayIdx = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(pt.weekday);
    const daysLeft = (7 - weekdayIdx) % 7;
    const edenSecLeft = (daysLeft === 0 ? 7 * 86400 : daysLeft * 86400) - secOfDay;
    const ed = Math.floor(edenSecLeft / 86400), eh = Math.floor((edenSecLeft % 86400) / 3600), em = Math.floor((edenSecLeft % 3600) / 60);
    const edenEl = document.getElementById('skyEdenCountdown');
    edenEl.textContent = ed > 0 ? t('edenDaysHours', { d: ed, h: pad2(eh) }) : `${pad2(eh)}:${pad2(em)}:${pad2(edenSecLeft % 60)}`;
    edenEl.classList.toggle('soon', edenSecLeft <= 3600 * 6);
    document.getElementById('skyEdenResetMini').title = t('edenResetTooltip', { hour: rh });
  }
  setInterval(updateSkyClocks, 1000);
  updateSkyClocks();

  /* ================================================================
     📅 Sky Status：季節・日々（イベント）・再訪の状況を常に3行で表示
     季節名やイベント名は長いため、実際の名前の代わりに種別名
     （季節／日々／再訪）を表示し、実際の名前は説明（title属性）で確認できます。
     ================================================================ */
  // skySchedule の日時（JST表記）を、閲覧環境のタイムゾーンに関係なくJSTとして解釈する
  // 'YYYY-MM-DDTHH:mm'（16文字）と 'YYYY-MM-DDTHH:mm:ss'（19文字、endの秒指定用）の両方に対応
  function parseSkyJst(s) {
    if (s.length === 16) return new Date(s + ':00+09:00');
    if (s.length === 19) return new Date(s + '+09:00');
    return new Date(s);
  }
  function fmtSkyDate(d) {
    return new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric' }).format(d);
  }
  function fmtSkyRemain(ms) {
    const days = Math.floor(ms / 86400000);
    if (days >= 1) return t('remainDays', { n: days });
    const h = Math.floor(ms / 3600000);
    if (h >= 1) return t('remainHours', { n: h });
    const mi = Math.floor(ms / 60000);
    if (mi >= 1) return t('remainMinutes', { n: mi });
    return t('remainSeconds', { n: Math.max(0, Math.floor(ms / 1000)) });
  }
  function escapeSkyHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 配列の中から「現在開催中のもの」と「一番近い今後の予定」を探す
  function findActiveOrNext(entries) {
    const now = new Date();
    let active = null, next = null;
    (entries || []).forEach(ev => {
      const start = parseSkyJst(ev.start);
      const end = parseSkyJst(ev.end);
      if (isNaN(start) || isNaN(end) || end < now) return;
      if (start <= now) {
        if (!active || end < active.end) active = { ev, start, end };
      } else {
        if (!next || start < next.start) next = { ev, start, end };
      }
    });
    return { active, next };
  }

  // renderSkyActive は1秒おきに再描画されるため、タップで開いた詳細（is-expanded）が
  // 次の描画で即座に消えてしまう。カテゴリごとの開閉状態をここに保持し、再描画時にも
  // 復元することで、タップした詳細がすぐ閉じてしまう問題を防ぐ。
  const skyExpandedCategories = new Set();
  function skyToggleActiveDetail(label, el) {
    if (skyExpandedCategories.has(label)) skyExpandedCategories.delete(label);
    else skyExpandedCategories.add(label);
    el.classList.toggle('is-expanded');
  }

  function skyCategoryRowHtml(icon, categoryKey, info, phrasing) {
    // categoryKey（'season'|'dailyEvent'|'revisit'）は言語に依存しない内部キー。
    // 表示用ラベルはt()で都度求め、開閉状態(skyExpandedCategories)のキーには
    // categoryKeyを使うことで、言語を切り替えても開閉状態が保持されるようにしている。
    const label = t(categoryKey);
    const now = new Date();
    let text, stateClass, entry;
    if (info.active) {
      entry = info.active;
      const remain = fmtSkyRemain(entry.end - now);
      text = phrasing ? phrasing.now(remain) : t('endsIn', { remain });
      stateClass = 'is-now';
    } else if (info.next) {
      entry = info.next;
      const remain = fmtSkyRemain(entry.start - now);
      text = phrasing ? phrasing.next(remain) : t('startsIn', { remain });
      stateClass = 'is-future';
    } else {
      return `
      <div class="sky-active-item">
        <span class="sky-active-icon">${icon}</span>
        <div class="sky-active-text">
          <div class="sky-active-name">${label}</div>
          <div class="sky-active-remain sky-active-none">${t('noPlans')}</div>
        </div>
      </div>`;
    }
    const range = LANG === 'en'
      ? `${fmtSkyDate(entry.start)} - ${fmtSkyDate(entry.end)}`
      : `${fmtSkyDate(entry.start)}〜${fmtSkyDate(entry.end)}`;
    const fullName = escapeSkyHtml(localizedField(entry.ev, 'name'));
    const noteText = localizedField(entry.ev, 'note');
    const noteHtml = noteText ? `<br>${escapeSkyHtml(noteText)}` : '';
    const titleText = LANG === 'en'
      ? `${fullName} (${range})${noteText ? ' / ' + escapeSkyHtml(noteText) : ''}`
      : `${fullName}（${range}）${noteText ? ' ／ ' + escapeSkyHtml(noteText) : ''}`;
    // PCではtitle属性のホバーで、スマホ等タップ操作の環境ではこの要素自体をタップして
    // .sky-active-detail を開閉することで、どちらでも正式名称・期間を確認できるようにする。
    const isExpanded = skyExpandedCategories.has(categoryKey);
    return `
      <div class="sky-active-item sky-active-toggle${isExpanded ? ' is-expanded' : ''}" title="${titleText}" role="button" tabindex="0"
        onclick="skyToggleActiveDetail('${categoryKey}', this)"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();skyToggleActiveDetail('${categoryKey}', this);}">
        <span class="sky-active-icon">${icon}</span>
        <div class="sky-active-text">
          <div class="sky-active-name">${label}<span class="sky-active-expand-hint">▸</span></div>
          <div class="sky-active-remain ${stateClass}">${text}</div>
          <div class="sky-active-detail">${LANG === 'en' ? `${fullName} (${range})${noteHtml}` : `${fullName}（${range}）${noteHtml}`}</div>
        </div>
      </div>`;
  }

  // recurringVisit（〇日おきに△日間、というパターンの再訪）から
  // 「現在開催中」または「一番近い今後の回」を計算する
  function findRecurringOccurrence(rule) {
    if (!rule || !rule.anchorStart || !rule.anchorEnd || !rule.intervalDays) return { active: null, next: null };
    const anchorStart = parseSkyJst(rule.anchorStart);
    const anchorEnd = parseSkyJst(rule.anchorEnd);
    const durationMs = anchorEnd - anchorStart;
    const intervalMs = rule.intervalDays * 86400000;
    const now = new Date();
    const k = Math.floor((now - anchorStart) / intervalMs);
    let active = null, next = null;
    for (let i = k - 1; i <= k + 1; i++) {
      const start = new Date(anchorStart.getTime() + i * intervalMs);
      const end = new Date(start.getTime() + durationMs);
      const ev = { name: rule.name, nameEn: rule.nameEn, note: rule.note || '', noteEn: rule.noteEn || '' };
      if (start <= now && now < end) {
        active = { ev, start, end };
      } else if (start > now && (!next || start < next.start)) {
        next = { ev, start, end };
      }
    }
    return { active, next };
  }

  // 単発の specialVisits（手動登録分）と recurringVisit（周期分）をあわせて、
  // 「現在開催中」「一番近い今後の回」を1つに絞り込む
  function findVisitInfo() {
    const manual = findActiveOrNext(skySchedule.specialVisits);
    const recurring = findRecurringOccurrence(recurringVisit);
    const active = manual.active || recurring.active;
    let next = null;
    [manual.next, recurring.next].forEach(n => {
      if (n && (!next || n.start < next.start)) next = n;
    });
    return { active, next };
  }

  function renderSkyActive() {
    const seasonInfo = findActiveOrNext(skySchedule.seasons);
    const eventInfo = findActiveOrNext(skySchedule.events);
    const visitInfo = findVisitInfo();

    const dotEl = document.getElementById('skyNowDot');
    if (dotEl) dotEl.style.visibility = (seasonInfo.active || eventInfo.active || visitInfo.active) ? 'visible' : 'hidden';

    document.getElementById('skyActiveList').innerHTML =
      skyCategoryRowHtml('🍁', 'season', seasonInfo) +
      skyCategoryRowHtml('🎪', 'dailyEvent', eventInfo) +
      skyCategoryRowHtml('🔁', 'revisit', visitInfo, {
        now:  remain => t('revisitEndsIn', { remain }),
        next: remain => t('revisitStartsIn', { remain })
      });
  }
  renderSkyActive();
  setInterval(renderSkyActive, 1000);

  /* ================================================================
     🔺 闇の破片（シャード）の有無・色・場所
     コミュニティで検証された予測ルール（Sky Shards: PlutoyDev/sky-shards の
     Shard Prediction Rule）を元に、いつ・何色の破片がどの王国に来るかを計算しています。
     日付・時刻の判定自体はPT（アメリカ太平洋時間）基準（ゲームの仕様どおり）ですが、
     「今日はもう来ない」の判定は日本時間の日付を基準にしています
     （日本時間の今日中に開始しないものは「なし」と表示）。
     場所名は9bit（https://9-bit.jp/skygold/）の各王国別ページの表記を参考にしていますが、
     一部（プレーリーの村落の島々／雨林のBoneyard・Forest Garden相当）は資料が
     はっきりしなかったため直訳での代用です。あくまで非公式の予測のため、
     実際とズレる場合があります。
     ================================================================ */
  const SHARD_REALMS = ['prairie', 'forest', 'valley', 'wasteland', 'vault'];
  const SHARD_REALM_JA = { prairie: '草原', forest: '雨林', valley: '峡谷', wasteland: '捨てられた地', vault: '書庫' };
  const SHARD_REALM_EN = { prairie: 'Prairie', forest: 'Forest', valley: 'Valley', wasteland: 'Wasteland', vault: 'Vault' };
  function realmName(key) {
    return LANG === 'en' ? (SHARD_REALM_EN[key] || key) : (SHARD_REALM_JA[key] || key);
  }
  const SHARD_WD_ISO = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
  // 黒い破片2種・赤い破片3種、それぞれの初回開始時刻（PT）・間隔・発生しない曜日（ISO: 月=1〜日=7）
  // maps は [草原, 雨林, 峡谷, 捨てられた地, 書庫] の順の場所名（9bit準拠）
  const SHARD_CONFIGS = [
    { color: 'black', offsetSec: (1 * 3600 + 50 * 60), intervalSec: 8 * 3600, noShardWkDay: [6, 7],
      maps: ['蝶々の住処', '小川', 'スケートリンク', '最初のエリア', '星月夜の砂漠（バラ付近）'],
      mapsEn: ['Butterfly Fields', 'The Brook', 'Skating Rink', 'First Area', 'Starlight Desert (near the Roses)'] }, // 土・日は無し
    { color: 'black', offsetSec: (2 * 3600 + 10 * 60), intervalSec: 8 * 3600, noShardWkDay: [7, 1],
      maps: ['草原の村', '開拓地', 'スケートリンク', '戦場', '星月夜の砂漠（バラ付近）'],
      mapsEn: ['Prairie Village', 'The Clearing', 'Skating Rink', 'Battlefield', 'Starlight Desert (near the Roses)'] }, // 日・月は無し
    { color: 'red',   offsetSec: (7 * 3600 + 40 * 60), intervalSec: 6 * 3600, noShardWkDay: [1, 2],
      maps: ['洞窟', '神殿奥', '夢見の町', '墓所', '星月夜の砂漠（舟のエリア）'],
      mapsEn: ['The Cave', 'Behind the Temple', 'Village of Dreams', 'Graveyard', 'Starlight Desert (near the boats)'] }, // 月・火は無し
    { color: 'red',   offsetSec: (2 * 3600 + 20 * 60), intervalSec: 6 * 3600, noShardWkDay: [2, 3],
      maps: ['鳥の巣', 'ツリーハウス', '夢見の町', '座礁船', '星月夜の砂漠（舟のエリア）'],
      mapsEn: ['Bird Nest', 'Treehouse', 'Village of Dreams', 'Shipwreck', 'Starlight Desert (near the boats)'] }, // 火・水は無し
    { color: 'red',   offsetSec: (3 * 3600 + 30 * 60), intervalSec: 6 * 3600, noShardWkDay: [3, 4],
      maps: ['楽園の島々', '晴れ間', '隠者の峠', '忘れられた方舟', '星月夜の砂漠（舟のエリア）'],
      mapsEn: ['Paradise Islands', 'Sunny Break', "Hermit's Pass", 'Forgotten Ark', 'Starlight Desert (near the boats)'] }, // 水・木は無し
  ];
  const SHARD_DURATION_SEC = 4 * 3600; // 破片は出現から4時間で消える

  // PTでの「その日の日付・曜日」から、その日の破片の色・場所・発生パターンを求める
  function computeShardForDay(dayOfMonth, weekdayIso) {
    const isRed = dayOfMonth % 2 === 1;
    const realmIdx = (dayOfMonth - 1) % 5;
    const infoIndex = isRed ? (Math.floor((dayOfMonth - 1) / 2) % 3) + 2 : (Math.floor(dayOfMonth / 2) % 2);
    const cfg = SHARD_CONFIGS[infoIndex];
    return {
      color: cfg.color,
      realmIdx,
      place: cfg.maps[realmIdx],
      placeEn: (cfg.mapsEn && cfg.mapsEn[realmIdx]) || cfg.maps[realmIdx],
      offsetSec: cfg.offsetSec,
      intervalSec: cfg.intervalSec,
      hasShardToday: !cfg.noShardWkDay.includes(weekdayIso)
    };
  }

  // 現在の状況（今まさに出現中 or 次はいつ・何色・どこか）を、開始・終了の絶対時刻つきで求める
  function findShardStatus() {
    const now = new Date();
    const pt = getZoneParts(PT_ZONE, now);
    const secOfDayNow = pt.h * 3600 + pt.mi * 60 + pt.s;
    const today = computeShardForDay(Number(pt.d), SHARD_WD_ISO[pt.weekday]);

    if (today.hasShardToday) {
      for (let i = 0; i < 3; i++) {
        const startSec = today.offsetSec + i * today.intervalSec;
        const endSec = startSec + SHARD_DURATION_SEC;
        if (secOfDayNow < endSec) {
          const start = new Date(now.getTime() + (startSec - secOfDayNow) * 1000);
          const end = new Date(now.getTime() + (endSec - secOfDayNow) * 1000);
          return { active: secOfDayNow >= startSec, color: today.color, place: today.place, placeEn: today.placeEn, realmIdx: today.realmIdx, start, end };
        }
      }
    }
    // 今日はもう終わった（or 今日は発生しない）→ 最大7日先まで探す
    for (let dayAhead = 1; dayAhead <= 7; dayAhead++) {
      const future = new Date(now.getTime() + dayAhead * 86400000);
      const fpt = getZoneParts(PT_ZONE, future);
      const info = computeShardForDay(Number(fpt.d), SHARD_WD_ISO[fpt.weekday]);
      if (info.hasShardToday) {
        const startSec = dayAhead * 86400 + info.offsetSec;
        const endSec = startSec + SHARD_DURATION_SEC;
        const start = new Date(now.getTime() + (startSec - secOfDayNow) * 1000);
        const end = new Date(now.getTime() + (endSec - secOfDayNow) * 1000);
        return { active: false, color: info.color, place: info.place, placeEn: info.placeEn, realmIdx: info.realmIdx, start, end };
      }
    }
    return null;
  }

  function renderShardBadge() {
    const status = findShardStatus();
    const badgeEl = document.getElementById('shardBadge');
    const dotEl = document.getElementById('shardDot');
    const textEl = document.getElementById('shardRealmText');
    if (!status) { badgeEl.style.display = 'none'; return; }

    const now = new Date();
    const place = LANG === 'en' ? (status.placeEn || status.place) : status.place;

    // 開催中でなければ、日本時間の「今日」の範囲内に開始するものだけを対象にする
    if (!status.active) {
      const todayJst = getZoneParts('Asia/Tokyo', now);
      const startJst = getZoneParts('Asia/Tokyo', status.start);
      const isStartToday = todayJst.y === startJst.y && todayJst.mo === startJst.mo && todayJst.d === startJst.d;
      if (!isStartToday) {
        dotEl.className = 'shard-dot';
        textEl.textContent = t('shardNone');
        badgeEl.classList.add('upcoming');
        badgeEl.title = t('shardNoneTodayTooltip');
        return;
      }
    }

    const colorName = status.color === 'red' ? t('redShard') : t('blackShard');
    const remain = fmtSkyRemain(status.active ? (status.end - now) : (status.start - now));

    dotEl.className = `shard-dot ${status.color} ${status.active ? 'active' : ''}`;
    textEl.textContent = place;
    badgeEl.classList.toggle('upcoming', !status.active);
    badgeEl.title = status.active
      ? t('shardActiveTooltip', { color: colorName, realm: realmName(SHARD_REALMS[status.realmIdx]), place, remain })
      : t('shardUpcomingTooltip', { color: colorName, place, remain });
  }
  renderShardBadge();
  setInterval(renderShardBadge, 30000);
</script>
